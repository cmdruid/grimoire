[package]
name = "grimoire-core"
version = "0.1.0"
edition = "2021"
description = "Headless Grimoire package-manager domain"
license = "MIT OR Apache-2.0"

[dependencies]
grimoire-pack = { path = "../grimoire-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"
